<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }
        #board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
        }
        .cell {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 2px solid #000;
            cursor: pointer;
        }
        #status {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>
<body>

<h1>Tic Tac Toe</h1>
<div id="board"></div>
<div id="status"></div>
<button onclick="resetGame()">Reset Game</button>

<script>
    const boardElement = document.getElementById('board');
    const statusElement = document.getElementById('status');
    let board = Array(3).fill(null).map(() => Array(3).fill(null));
    let currentPlayer = 'X';

    function createBoard() {
        boardElement.innerHTML = '';
        for (let row = 0; row < 3; row++) {
            for (let col = 0; col < 3; col++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.addEventListener('click', () => makeMove(row, col));
                cell.textContent = board[row][col];
                boardElement.appendChild(cell);
            }
        }
    }

    function makeMove(row, col) {
        if (board[row][col] || checkWinner()) return;

        board[row][col] = currentPlayer;
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        createBoard();
        updateStatus();
    }

    function checkWinner() {
        const lines = [
            [[0, 0], [0, 1], [0, 2]],
            [[1, 0], [1, 1], [1, 2]],
            [[2, 0], [2, 1], [2, 2]],
            [[0, 0], [1, 0], [2, 0]],
            [[0, 1], [1, 1], [2, 1]],
            [[0, 2], [1, 2], [2, 2]],
            [[0, 0], [1, 1], [2, 2]],
            [[0, 2], [1, 1], [2, 0]],
        ];

        for (const line of lines) {
            const [[a, b], [c, d], [e, f]] = line;
            if (board[a][b] && board[a][b] === board[c][d] && board[a][b] === board[e][f]) {
                statusElement.textContent = `Player ${board[a][b]} wins!`;
                return true;
            }
        }
        if (board.flat().every(cell => cell)) {
            statusElement.textContent = "It's a draw!";
            return true;
        }
        return false;
    }

    function updateStatus() {
        if (!checkWinner()) {
            statusElement.textContent = `Current Player: ${currentPlayer}`;
        }
    }

    function resetGame() {
        board = Array(3).fill(null).map(() => Array(3).fill(null));
        currentPlayer = 'X';
        createBoard();
        statusElement.textContent = `Current Player: ${currentPlayer}`;
    }

    createBoard();
</script>

</body>
</html>
